services:
  db:
    image: postgres:16-alpine
    container_name: oaps-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [oaps-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    image: oaps-app:local
    container_name: oaps-app
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      APP_PORT: "8000"
    ports:
      - "${APP_HOST_PORT:-8081}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [oaps-network]

volumes:
  postgres_data:
networks:
  oaps-network:
    driver: bridge
